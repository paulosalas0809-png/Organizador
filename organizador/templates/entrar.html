<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Organizador</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{{ url_for('static', filename='icono.svg') }}">
  <meta name="theme-color" content="#d9683b">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="login">
    <form class="card" method="post">
      <div class="logo">🗓️</div>
      <h1>Organizador</h1>
      <p>Tu asistente para un día productivo</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <input type="password" name="clave" placeholder="Contraseña" autocomplete="current-password" required autofocus>
      <button class="btn block" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
