<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orga</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{{ url_for('static', filename='icono.svg') }}">
  <meta name="theme-color" content="#4f46e5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=7">
</head>
<body>
  <main class="login">
    <form class="card" method="post">
      <img class="logo" src="{{ url_for('static', filename='icono.svg') }}" alt="">
      <h1>Orga</h1>
      <p>Tu agente personal de productividad</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <input type="password" name="clave" placeholder="Contraseña" autocomplete="current-password" required autofocus>
      <button class="btn block grande" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
