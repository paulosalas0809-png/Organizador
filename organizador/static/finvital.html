<div id="root"></div>

<script>
"use strict";
const { useState, useMemo, useEffect, useRef } = React;
const html = htm.bind(React.createElement);
const { ResponsiveContainer, AreaChart, Area, BarChart, Bar, LineChart, Line, XAxis, YAxis, Tooltip, CartesianGrid, ReferenceLine, Legend, Cell } = Recharts;
const CLAVE = "finvital-db-v1";
const C = { indigo: "var(--indigo)", emerald: "var(--emerald)", amber: "var(--amber)", rose: "var(--rose)" };

// ------------------------------------------------------------ utilidades
const uid = () => Math.random().toString(36).slice(2, 9);
const norm = (t) => String(t ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fecha = (s) => new Date(s + "T12:00:00");
const hoy = () => fecha(iso(new Date()));
const dias = (a, b) => Math.round((b - a) / 864e5);
const masDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const lunes = (s) => { const d = fecha(s); return iso(masDias(d, -((d.getDay() + 6) % 7))); };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const MESES_L = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const corto = (s) => { const d = fecha(s); return `${d.getDate()} ${MESES[d.getMonth()]}`; };

function aNumero(v) {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  let s = String(v ?? "").replace(/[^\d,.\-]/g, "");
  if (!s) return 0;
  const c = s.lastIndexOf(","), p = s.lastIndexOf(".");
  if (c > -1 && p > -1) s = c > p ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (c > -1) s = /,\d{1,2}$/.test(s) ? s.replace(",", ".") : s.replace(/,/g, "");
  const n = parseFloat(s); return isFinite(n) ? n : 0;
}
// Devuelve {f: "AAAA-MM-DD", mes: true|false} o null
function aFecha(v) {
  const s = String(v ?? "").trim(); if (!s) return null;
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return { f: `${m[1]}-${pad(m[2])}-${pad(m[3])}`, mes: false };
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) return { f: `${m[3].length === 2 ? "20" + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}`, mes: false };
  if ((m = s.match(/^(\d{4})[\/\-](\d{1,2})$/))) return { f: `${m[1]}-${pad(m[2])}-01`, mes: true };
  if ((m = s.match(/^(\d{1,2})[\/\-](\d{4})$/))) return { f: `${m[2]}-${pad(m[1])}-01`, mes: true };
  const n = norm(s), i = MESES_L.findIndex((x) => n.startsWith(x) || n.startsWith(x.slice(0, 3)));
  if (i > -1) { const a = (n.match(/\d{4}/) || [new Date().getFullYear()])[0]; return { f: `${a}-${pad(i + 1)}-01`, mes: true }; }
  const d = new Date(s); return isNaN(d) ? null : { f: iso(d), mes: false };
}
function deCSV(t) {
  const filas = []; let f = [], c = "", q = false; t = t.replace(/^﻿/, "");
  const sep = (t.split("\n")[0].match(/;/g) || []).length > (t.split("\n")[0].match(/,/g) || []).length ? ";" : t.includes("\t") && !t.includes(",") ? "\t" : ",";
  for (let i = 0; i < t.length; i++) { const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true; else if (ch === sep) { f.push(c); c = ""; }
    else if (ch === "\n") { f.push(c); filas.push(f); f = []; c = ""; } else if (ch !== "\r") c += ch; }
  if (c || f.length) { f.push(c); filas.push(f); }
  return filas.filter((x) => x.some((y) => String(y).trim()));
}
const COLUMNAS = {
  gastos: { fecha: ["fecha", "dia", "date"], categoria: ["tipo", "categoria", "concepto", "rubro"], monto: ["monto", "importe", "valor", "total", "gasto"], tarjeta: ["tarjeta", "medio", "pago"] },
  salud: { fecha: ["fecha", "mes", "semana", "periodo"], calorias: ["calorias", "kcal", "cal"], diasGym: ["dias gym", "gym", "asistencia", "dias", "entrenamientos"] },
  rutina: { fecha: ["fecha", "dia"], ejercicio: ["ejercicio", "movimiento"], peso: ["peso", "carga", "kg"], reps: ["repeticiones", "reps", "rep"] },
};
// Acepta texto CSV, JSON de Apps Script (lista de objetos o de filas) y devuelve filas limpias
function interpretar(tipo, texto) {
  let filas; const t = texto.trim();
  if (!t) return [];
  if (t[0] === "[" || t[0] === "{") {
    let j = JSON.parse(t);
    if (!Array.isArray(j)) j = j.data || j.datos || j.rows || j.filas || j.values || Object.values(j).find(Array.isArray) || [];
    filas = j.length && !Array.isArray(j[0]) ? [Object.keys(j[0]), ...j.map((o) => Object.values(o))] : j;
  } else filas = deCSV(t);
  if (filas.length < 2) throw new Error("no encontré filas con datos");
  const cab = filas[0].map(norm), mapa = {};
  for (const [campo, alias] of Object.entries(COLUMNAS[tipo])) mapa[campo] = cab.findIndex((c) => alias.some((a) => c === a || c.includes(a)));
  const falta = Object.entries(mapa).filter(([k, i]) => i < 0 && k !== "tarjeta").map(([k]) => k);
  if (falta.length) throw new Error("faltan las columnas: " + falta.join(", "));
  const v = (f, k) => mapa[k] < 0 ? "" : f[mapa[k]];
  return filas.slice(1).map((f) => {
    const d = aFecha(v(f, "fecha")); if (!d) return null;
    if (tipo === "gastos") return { fecha: d.f, categoria: String(v(f, "categoria") || "Otros").trim(), monto: Math.abs(aNumero(v(f, "monto"))), tarjeta: String(v(f, "tarjeta") || "").trim() };
    if (tipo === "salud") return { fecha: d.f, mes: d.mes, calorias: aNumero(v(f, "calorias")), diasGym: aNumero(v(f, "diasGym")) };
    return { fecha: d.f, ejercicio: String(v(f, "ejercicio") || "").trim(), peso: aNumero(v(f, "peso")), reps: aNumero(v(f, "reps")) };
  }).filter((x) => x && (tipo !== "rutina" || x.ejercicio)).sort((a, b) => a.fecha.localeCompare(b.fecha));
}
const CAB = { gastos: ["fecha", "categoria", "monto", "tarjeta"], salud: ["fecha", "calorias", "diasGym"], rutina: ["fecha", "ejercicio", "peso", "reps"] };
const aCSV = (tipo, filas) => [CAB[tipo].join(","), ...filas.map((f) => CAB[tipo].map((c) => { const s = String(c === "fecha" && f.mes ? f.fecha.slice(0, 7) : f[c] ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(","))].join("\n");

// ------------------------------------------------------------ datos de prueba
function ejemplo() {
  let semilla = 7; const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
  const h = hoy(), gastos = [], salud = [], rutina = [];
  const cats = [["Comida", 14, 34, .75], ["Snacks", 4, 12, .45], ["Transporte", 5, 14, .6], ["Ocio", 20, 70, .12], ["Estudios", 30, 90, .06], ["Servicios", 40, 80, .04]];
  for (let i = 110; i >= 0; i--) {
    const d = masDias(h, -i), f = iso(d);
    cats.forEach(([c, a, b, p]) => { if (azar() < p) gastos.push({ fecha: f, categoria: c, monto: Math.round((a + azar() * (b - a)) * 10) / 10, tarjeta: azar() < .35 ? "Visa Signature" : "" }); });
    if (d.getDate() === 1 || i === 110) gastos.push({ fecha: f, categoria: "Ingreso", monto: 2400, tarjeta: "" });
  }
  const l0 = fecha(lunes(iso(h)));
  for (let w = 13; w >= 0; w--) {
    const ini = masDias(l0, -7 * w);
    const gym = w === 0 ? Math.min(3, (h.getDay() + 6) % 7) : Math.round(2.4 + azar() * 2.6);
    salud.push({ fecha: iso(ini), mes: false, calorias: Math.round(2050 + azar() * 520), diasGym: clamp(gym, 0, 6) });
    [["Press banca", 55, 1.1], ["Sentadilla", 75, 1.6], ["Peso muerto", 90, 1.9], ["Dominadas lastradas", 5, .6]].forEach(([e, base, inc], k) => {
      if (w === 0 && k > 1) return;
      rutina.push({ fecha: iso(masDias(ini, k % 3)), ejercicio: e, peso: Math.round((base + (13 - w) * inc + (azar() - .5) * 2) * 2) / 2, reps: 5 + Math.round(azar() * 3) });
    });
  }
  return {
    demo: true, tema: "dark", moneda: "S/",
    fuentes: { gastos: "", salud: "", rutina: "" },
    metas: { ingresoMensual: 2400, presupuestoMensual: 1700, calorias: 2300, tolerancia: 8, gymSemanal: 4, comida: "comida, snacks, restaurante, delivery, mercado, almuerzo, cena, desayuno" },
    cuentas: [{ id: uid(), nombre: "Cuenta sueldo", saldo: 1850 }, { id: uid(), nombre: "Billetera digital", saldo: 320 }],
    cajitas: [{ id: uid(), nombre: "Fondo de emergencia", saldo: 2600, meta: 6000 }, { id: uid(), nombre: "Inversión a futuro", saldo: 1500, meta: 10000 }, { id: uid(), nombre: "Libros", saldo: 180, meta: 400 }],
    tarjetas: [
      { id: uid(), nombre: "Visa Signature", limite: 5000, cierre: 10, pago: 5, meta: 1000, deuda: 640, defecto: false },
      { id: uid(), nombre: "Mastercard Clásica", limite: 2500, cierre: 24, pago: 18, meta: 500, deuda: 210, defecto: true },
    ],
    gastos, salud, rutina,
  };
}
function sanear(d) {
  const b = ejemplo(); d = d && typeof d === "object" ? d : {};
  const o = { ...b, ...d, demo: !!d.demo, fuentes: { ...b.fuentes, ...(d.fuentes || {}) }, metas: { ...b.metas, ...(d.metas || {}) } };
  for (const k of ["cuentas", "cajitas", "tarjetas", "gastos", "salud", "rutina"]) o[k] = Array.isArray(d[k]) ? d[k] : b[k];
  return o;
}
function cargarDB() { try { const g = JSON.parse(localStorage.getItem(CLAVE)); return g ? sanear(g) : ejemplo(); } catch (e) { return ejemplo(); } }

// ------------------------------------------------------------ cálculos
const esIngreso = (g) => /ingreso|sueldo|salario|pago recibido|abono/.test(norm(g.categoria));
const mesDe = (f) => f.slice(0, 7);
function diaDelMes(a, m, d) { return new Date(a, m, Math.min(d, new Date(a, m + 1, 0).getDate()), 12); }
function ciclo(t, h) {
  let cierre = diaDelMes(h.getFullYear(), h.getMonth(), t.cierre);
  if (cierre < h) cierre = diaDelMes(h.getFullYear(), h.getMonth() + 1, t.cierre);
  const anterior = diaDelMes(cierre.getFullYear(), cierre.getMonth() - 1, t.cierre);
  let pago = diaDelMes(cierre.getFullYear(), cierre.getMonth(), t.pago);
  if (pago <= cierre) pago = diaDelMes(cierre.getFullYear(), cierre.getMonth() + 1, t.pago);
  return { inicio: masDias(anterior, 1), cierre, pago, diasCierre: dias(h, cierre), financiamiento: dias(h, pago) };
}
function calcular(db) {
  const h = hoy(), mesAct = iso(h).slice(0, 7), M = db.metas;
  const gastos = db.gastos.filter((g) => !esIngreso(g)), ingresos = db.gastos.filter(esIngreso);
  const suma = (xs) => xs.reduce((a, x) => a + x.monto, 0);
  const meses = []; for (let i = 5; i >= 0; i--) { const d = new Date(h.getFullYear(), h.getMonth() - i, 1, 12); meses.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); }
  const porMes = meses.map((m) => {
    const g = suma(gastos.filter((x) => mesDe(x.fecha) === m)), ing = suma(ingresos.filter((x) => mesDe(x.fecha) === m)) || (g ? M.ingresoMensual : 0);
    return { mes: m, gasto: g, ingreso: ing, ahorro: ing - g };
  }).filter((x) => x.gasto || x.ingreso);
  const act = porMes.find((x) => x.mes === mesAct) || { gasto: 0, ingreso: M.ingresoMensual, ahorro: M.ingresoMensual };
  const completos = porMes.filter((x) => x.mes !== mesAct).slice(-3);
  const gastoProm = completos.length ? suma(completos.map((x) => ({ monto: x.gasto }))) / completos.length : act.gasto;
  const ahorroProm = completos.length ? completos.reduce((a, x) => a + x.ahorro, 0) / completos.length : act.ahorro;
  const liquido = db.cuentas.reduce((a, x) => a + (+x.saldo || 0), 0), cajitas = db.cajitas.reduce((a, x) => a + (+x.saldo || 0), 0);
  const deuda = db.tarjetas.reduce((a, x) => a + (+x.deuda || 0), 0);
  const patrimonio = liquido + cajitas - deuda;
  const proy = Array.from({ length: 13 }, (_, i) => ({ m: i, etiqueta: i === 0 ? "Hoy" : `+${i}`, valor: Math.round(patrimonio + ahorroProm * i) }));

  // tarjetas
  const defecto = db.tarjetas.find((t) => t.defecto);
  const tarjetas = db.tarjetas.map((t) => {
    const c = ciclo(t, h), i0 = iso(c.inicio), h0 = iso(h);
    const mias = gastos.filter((g) => g.fecha >= i0 && g.fecha <= h0 && (g.tarjeta ? norm(g.tarjeta) === norm(t.nombre) : defecto && defecto.id === t.id));
    const consumo = suma(mias);
    return { ...t, ...c, consumo, falta: Math.max(0, (+t.meta || 0) - consumo), pct: t.meta ? clamp(consumo / t.meta) * 100 : 0, uso: t.limite ? clamp(((+t.deuda || 0)) / t.limite) * 100 : 0 };
  });
  const mejor = tarjetas.length ? tarjetas.reduce((a, b) => (b.financiamiento > a.financiamiento ? b : a)) : null;

  // semanas
  const l0 = fecha(lunes(iso(h))), semanas = Array.from({ length: 8 }, (_, i) => iso(masDias(l0, -7 * (7 - i))));
  const comidas = M.comida.split(",").map(norm).filter(Boolean);
  const esComida = (g) => comidas.some((c) => norm(g.categoria).includes(c));
  const saludSem = (s) => {
    const fila = db.salud.find((x) => !x.mes && lunes(x.fecha) === s);
    if (fila) return { calorias: fila.calorias || null, gym: fila.diasGym };
    const m = db.salud.find((x) => x.mes && mesDe(x.fecha) === mesDe(s));
    return m ? { calorias: m.calorias, gym: Math.round((m.diasGym / 4.345) * 10) / 10 } : null;
  };
  const semanal = semanas.map((s) => {
    const fin = iso(masDias(fecha(s), 6)), sal = saludSem(s);
    return { semana: s, etiqueta: corto(s), comida: Math.round(suma(gastos.filter((g) => g.fecha >= s && g.fecha <= fin && esComida(g)))), cumplimiento: sal && sal.calorias && M.calorias ? Math.round((sal.calorias / M.calorias) * 100) : null, calorias: sal ? sal.calorias : null, gym: sal ? sal.gym : null };
  });
  const semAct = semanal[7];

  // progresión de cargas
  const cuenta = {}; db.rutina.forEach((r) => cuenta[r.ejercicio] = (cuenta[r.ejercicio] || 0) + 1);
  const ejercicios = Object.entries(cuenta).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
  const progreso = (ej) => { const por = {}; db.rutina.filter((r) => r.ejercicio === ej).forEach((r) => { if (!por[r.fecha] || r.peso > por[r.fecha].peso) por[r.fecha] = r; }); return Object.values(por).sort((a, b) => a.fecha.localeCompare(b.fecha)).slice(-14).map((r) => ({ etiqueta: corto(r.fecha), peso: r.peso, reps: r.reps })); };

  // índice de disciplina
  const diasMes = new Date(h.getFullYear(), h.getMonth() + 1, 0).getDate(), prorrata = (M.presupuestoMensual || 0) * (h.getDate() / diasMes);
  const dPresu = !M.presupuestoMensual ? null : act.gasto <= prorrata ? 1 : clamp(1 - (act.gasto - prorrata) / prorrata);
  const ult4 = semanal.slice(-4).filter((x) => x.gym != null);
  const dGym = ult4.length && M.gymSemanal ? ult4.reduce((a, x) => a + clamp(x.gym / M.gymSemanal), 0) / ult4.length : null;
  const conCal = ult4.filter((x) => x.calorias != null);
  const dCal = conCal.length && M.calorias ? conCal.reduce((a, x) => { const dev = Math.abs(x.calorias - M.calorias) / M.calorias, tol = (M.tolerancia || 0) / 100; return a + (dev <= tol ? 1 : clamp(1 - (dev - tol) / .25)); }, 0) / conCal.length : null;
  const partes = [dPresu, dGym, dCal].filter((x) => x != null);
  const disciplina = partes.length ? Math.round((partes.reduce((a, b) => a + b, 0) / partes.length) * 100) : null;

  return { act, porMes, gastoProm, ahorroProm, liquido, cajitas, deuda, patrimonio, proy, tarjetas, mejor, semanal, semAct, ejercicios, progreso,
    tasaAhorro: act.ingreso ? (act.ingreso - act.gasto) / act.ingreso : null, runway: gastoProm ? (liquido + cajitas) / gastoProm : null,
    disciplina, dPresu, dGym, dCal, prorrata };
}

// ------------------------------------------------------------ datos reales guardados en el servidor
// Devuelve {ok, db} o {ok:false, motivo}. Al pasar de datos de prueba a reales, los saldos y tarjetas
// de ejemplo se vacían: esos datos no vienen en el paquete y no deben parecer tuyos.
async function traerReales(db) {
  let r;
  try { r = await fetch("/api/finvital/datos", { credentials: "same-origin" }); } catch (e) { return { ok: false, motivo: "red" }; }
  if (r.status === 401) return { ok: false, motivo: "sesion" };
  if (!r.ok) return { ok: false, motivo: "vacio" };
  const p = await r.json(), eraDemo = db.demo;
  const nuevo = { ...db, demo: false, real: p.generado, origen: p.origen || {},
    gastos: interpretar("gastos", JSON.stringify(p.gastos)), salud: p.salud, rutina: p.rutina, metas: { ...db.metas, ...(p.metas || {}) } };
  if (eraDemo) Object.assign(nuevo, {
    cuentas: [{ id: uid(), nombre: "Cuenta principal", saldo: 0 }],
    cajitas: [["Fondo de emergencia"], ["Inversión a futuro"], ["Libros"]].map(([n]) => ({ id: uid(), nombre: n, saldo: 0, meta: 0 })),
    tarjetas: [], metas: { ...nuevo.metas, ingresoMensual: 0, presupuestoMensual: 0 } });
  return { ok: true, db: nuevo, filas: p.gastos.length };
}

function Tip({ active, payload, label, fmt }) {
  if (!active || !payload || !payload.length) return null;
  return html`<div class="tip"><b>${label}</b>${payload.filter((p) => p.value != null).map((p) => html`<div key=${p.dataKey}><span><i style=${{ background: p.color || p.fill }}></i>${p.name}</span><span class="num">${fmt ? fmt(p.value, p.dataKey) : p.value}</span></div>`)}</div>`;
}
const Num = ({ value, onChange, ...r }) => html`<input type="number" inputMode="decimal" value=${value} onChange=${(e) => onChange(e.target.value === "" ? "" : +e.target.value)} ...${r} />`;

        </div>
        <div class="card stack">
          <div class="row"><div class="grow"><h3>Consistencia semanal</h3><p class="muted" style=${{ fontSize: 12.5 }}>${gymHoy} de ${db.metas.gymSemanal} días entrenados esta semana</p></div>
            <div class="dots">${Array.from({ length: Math.max(db.metas.gymSemanal, Math.ceil(gymHoy)) || 1 }, (_, i) => html`<i key=${i} class=${i < gymHoy ? "on" : ""}></i>`)}</div></div>
          <div class="chart sm"><${ResponsiveContainer}><${BarChart} data=${k.semanal} margin=${{ top: 8, right: 8, left: -18, bottom: 0 }}>
            <${CartesianGrid} stroke="var(--grid)" vertical=${false} /><${XAxis} dataKey="etiqueta" tickLine=${false} axisLine=${false} /><${YAxis} tickLine=${false} axisLine=${false} allowDecimals=${false} domain=${[0, 7]} ticks=${[0, 2, 4, 6]} />
            <${Tooltip} cursor=${{ fill: "var(--surface-2)" }} content=${html`<${Tip} fmt=${(v) => v + " días"} />`} /><${ReferenceLine} y=${db.metas.gymSemanal} stroke="var(--muted)" strokeDasharray="4 3" label=${{ value: "meta", position: "insideTopRight", fill: "var(--muted)", fontSize: 11 }} />
            <${Bar} dataKey="gym" name="Días de gym" radius=${[4, 4, 0, 0]} maxBarSize=${26}>${k.semanal.map((s, i) => html`<${Cell} key=${i} fill=${(s.gym ?? 0) >= db.metas.gymSemanal ? "var(--emerald)" : "var(--indigo)"} />`)}<//>
          <//><//></div>
          <div class="row" style=${{ fontSize: 12 }}><span class="chip em">Meta cumplida</span><span class="chip in">Por debajo de la meta</span></div>
        </div>
      </div>
      <div class="grid g2 eq" style=${{ marginTop: 12 }}>
        <div class="card stack">
          <div><h3>Gasto en comida y snacks vs. meta calórica</h3><p class="muted" style=${{ fontSize: 12.5 }}>Dos gráficos con las mismas semanas: pasa el cursor para compararlas.</p></div>
          <div class="chart sm"><${ResponsiveContainer}><${BarChart} data=${k.semanal} syncId="vital" margin=${{ top: 8, right: 8, left: 0, bottom: 0 }}>
            <${CartesianGrid} stroke="var(--grid)" vertical=${false} /><${XAxis} dataKey="etiqueta" tickLine=${false} axisLine=${false} hide=${true} /><${YAxis} tickLine=${false} axisLine=${false} width=${44} />
            <${Tooltip} cursor=${{ fill: "var(--surface-2)" }} content=${html`<${Tip} fmt=${(v) => S(v)} />`} /><${Bar} dataKey="comida" name="Gasto en comida" fill="var(--indigo)" radius=${[4, 4, 0, 0]} maxBarSize=${26} />
          <//><//></div>
          <div class="chart sm"><${ResponsiveContainer}><${LineChart} data=${k.semanal} syncId="vital" margin=${{ top: 8, right: 8, left: 0, bottom: 0 }}>
            <${CartesianGrid} stroke="var(--grid)" vertical=${false} /><${XAxis} dataKey="etiqueta" tickLine=${false} axisLine=${false} /><${YAxis} tickLine=${false} axisLine=${false} width=${44} domain=${[70, 130]} tickFormatter=${(v) => v + "%"} />
            <${Tooltip} content=${html`<${Tip} fmt=${(v) => v + "% de la meta"} />`} /><${ReferenceLine} y=${100} stroke="var(--muted)" strokeDasharray="4 3" label=${{ value: "meta", position: "insideTopRight", fill: "var(--muted)", fontSize: 11 }} />
            <${Line} type="monotone" dataKey="cumplimiento" name="Calorías" stroke="var(--emerald)" strokeWidth=${2} dot=${{ r: 4, strokeWidth: 0, fill: "var(--emerald)" }} connectNulls=${true} />
          <//><//></div>
          <div class="row" style=${{ fontSize: 12 }}><span class="chip in">■ Gasto semanal en comida (${db.moneda})</span><span class="chip em">● Calorías como % de la meta</span></div>
        </div>
        <div class="card stack">
          <div class="row"><div class="grow"><h3>Progresión de cargas</h3><p class="muted" style=${{ fontSize: 12.5 }}>Mejor peso por sesión${prog.length > 1 ? html` · <b style=${{ color: prog.at(-1).peso >= prog[0].peso ? C.emerald : C.rose }}>${prog.at(-1).peso - prog[0].peso >= 0 ? "+" : ""}${(prog.at(-1).peso - prog[0].peso).toFixed(1)} kg</b> en el periodo` : ""}</p></div></div>
          <div class="row">${k.ejercicios.slice(0, 5).map((e) => html`<button key=${e} class=${"btn sm " + (e === ejSel ? "" : "sec")} onClick=${() => setEj(e)}>${e}</button>`)}</div>
          ${prog.length ? html`<div class="chart"><${ResponsiveContainer}><${LineChart} data=${prog} margin=${{ top: 8, right: 10, left: 0, bottom: 0 }}>
            <${CartesianGrid} stroke="var(--grid)" vertical=${false} /><${XAxis} dataKey="etiqueta" tickLine=${false} axisLine=${false} minTickGap=${18} /><${YAxis} tickLine=${false} axisLine=${false} width=${44} domain=${["dataMin - 5", "dataMax + 5"]} tickFormatter=${(v) => Math.round(v)} />
            <${Tooltip} content=${html`<${Tip} fmt=${(v) => v + " kg"} />`} /><${Line} type="monotone" dataKey="peso" name=${ejSel} stroke="var(--indigo)" strokeWidth=${2} dot=${{ r: 3, strokeWidth: 0, fill: "var(--indigo)" }} activeDot=${{ r: 5 }} />
          <//><//></div>` : html`<p class="muted">Aún no hay registros de rutina.</p>`}
        </div>
      </div>
    </section>
  </div>
  ${modal && html`<${Datos} db=${db} setDB=${setDB} cerrar=${() => setModal(false)} toast=${toast} />`}
  ${aviso && html`<div class="toast">${aviso}</div>`}`;
}

// ------------------------------------------------------------ conexión de datos
const NOMBRES = { gastos: "Gastos personales", salud: "Calorías y gym", rutina: "Rutina y cargas" };
const COLS_TXT = { gastos: "Fecha, Tipo/Categoría, Monto (opcional: Tarjeta)", salud: "Fecha o Mes, Calorías, Días Gym", rutina: "Fecha, Ejercicio, Peso, Repeticiones" };
function Datos({ db, setDB, cerrar, toast }) {
  const [tab, setTab] = useState("fuentes");
  const [estado, setEstado] = useState({});
  const [tipo, setTipo] = useState("gastos");
  const [texto, setTexto] = useState(() => aCSV("gastos", db.gastos));
  const [json, setJson] = useState("");
  const [nuevo, setNuevo] = useState({ fecha: iso(new Date()), categoria: "Comida", monto: "", tarjeta: "" });
  const elegir = (t) => { setTipo(t); setTexto(aCSV(t, db[t])); };
  const setFuente = (k, v) => setDB((d) => ({ ...d, fuentes: { ...d.fuentes, [k]: v.trim() } }));
  const setMeta = (k, v) => setDB((d) => ({ ...d, metas: { ...d.metas, [k]: v } }));
  async function sincronizar(k) {
    const u = db.fuentes[k];
    if (!/^https:\/\//i.test(u)) { setEstado((e) => ({ ...e, [k]: ["err", "Pega una URL que empiece con https://"] })); return false; }
    setEstado((e) => ({ ...e, [k]: ["", "Leyendo…"] }));
    try {
      const r = await fetch(u, { redirect: "follow" }); if (!r.ok) throw new Error("la hoja respondió " + r.status);
      const filas = interpretar(k, await r.text());
      setDB((d) => ({ ...d, [k]: filas, demo: false }));
      setEstado((e) => ({ ...e, [k]: ["ok", `${filas.length} filas · ${new Date().toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" })}`] })); return true;
    } catch (err) { setEstado((e) => ({ ...e, [k]: ["err", /fetch/i.test(err.message) ? "No pude abrir la URL: revisa que esté publicada para cualquiera con el enlace" : "Error: " + err.message] })); return false; }
  }
  const todas = async () => { const ks = Object.keys(NOMBRES).filter((k) => db.fuentes[k]); if (!ks.length) return toast("Pega al menos una URL"); const r = await Promise.all(ks.map(sincronizar)); toast(`${r.filter(Boolean).length} de ${ks.length} hojas sincronizadas`); };
  const aplicar = () => { try { const f = interpretar(tipo, texto); setDB((d) => ({ ...d, [tipo]: f, demo: false })); toast(`${NOMBRES[tipo]}: ${f.length} filas guardadas`); } catch (e) { toast("No pude leer esos datos: " + e.message); } };
  const agregar = () => { if (!nuevo.monto) return toast("Escribe el monto"); setDB((d) => { const g = [...d.gastos, { ...nuevo, monto: Math.abs(+nuevo.monto) }].sort((a, b) => a.fecha.localeCompare(b.fecha)); if (tipo === "gastos") setTexto(aCSV("gastos", g)); return { ...d, gastos: g, demo: false }; }); setNuevo((n) => ({ ...n, monto: "" })); toast("Gasto agregado"); };
  const importar = () => { try { const d = JSON.parse(json); if (!d || typeof d !== "object" || Array.isArray(d)) throw new Error("debe ser un objeto JSON"); let n = 0; const p = {};
      for (const k of ["gastos", "salud", "rutina"]) if (Array.isArray(d[k])) { p[k] = interpretar(k, JSON.stringify(d[k])); n++; }
      for (const k of ["cuentas", "cajitas", "tarjetas"]) if (Array.isArray(d[k])) { p[k] = d[k].map((x) => ({ id: uid(), ...x })); n++; }
      if (d.metas && typeof d.metas === "object") { p.metas = { ...db.metas, ...d.metas }; n++; }
      if (!n) throw new Error("no encontré gastos, salud, rutina, cuentas, cajitas, tarjetas ni metas");
      setDB((x) => ({ ...x, ...p, demo: false })); toast(`JSON aplicado: ${n} bloque(s)`); setJson(""); } catch (e) { toast("JSON no válido: " + e.message); } };
  const M = db.metas;
  return html`<div class="modal" onMouseDown=${(e) => e.target === e.currentTarget && cerrar()}><div class="card">
    <div class="row"><h2 class="grow">Conexión de datos</h2><button class="btn ghost" onClick=${cerrar}>✕</button></div>
    <div class="tabs">${[["fuentes", "Google Sheets"], ["manual", "Carga manual"], ["json", "JSON rápido"], ["metas", "Metas y ajustes"]].map(([k, n]) => html`<button key=${k} class=${tab === k ? "on" : ""} onClick=${() => setTab(k)}>${n}</button>`)}</div>
    ${tab === "fuentes" && html`<div class="stack">
      <div class="card stack" style=${{ background: "var(--surface-2)", gap: 8 }}>
        <div class="row"><div class="grow"><h3>Mis datos reales</h3><p class="muted" style=${{ fontSize: 12.5 }}>Hoja «FINANZAS PAULO», Pulso y Gym Tracker${db.real ? ` · leídos el ${corto(db.real)}` : ""}. Requiere tu sesión de Orga.</p></div>
          <button class="btn" onClick=${async () => { const r = await traerReales(db); if (r.ok) { setDB(r.db); toast("Datos reales cargados: " + r.filas + " gastos"); } else toast(r.motivo === "sesion" ? "Inicia sesión en Orga primero y vuelve a intentarlo" : "No pude traer tus datos del servidor"); }}>Traer mis datos</button></div>
      </div>
      <p class="muted" style=${{ fontSize: 13 }}>Pega la URL de un Apps Script que devuelva JSON, o el enlace CSV de «Archivo → Compartir → Publicar en la web». La primera fila debe tener los nombres de las columnas.</p>
      ${Object.keys(NOMBRES).map((k) => html`<div class="stack" style=${{ gap: 5 }} key=${k}>
        <label class="f">${NOMBRES[k]} <span style=${{ fontWeight: 400 }}>· columnas: ${COLS_TXT[k]}</span>
          <div class="row" style=${{ flexWrap: "nowrap" }}><input type="url" placeholder="https://docs.google.com/…output=csv  o  https://script.google.com/…/exec" value=${db.fuentes[k]} onChange=${(e) => setFuente(k, e.target.value)} /><button class="btn sec" onClick=${() => sincronizar(k)}>Probar</button></div></label>
        ${estado[k] && html`<div class=${"estado " + estado[k][0]}><i></i>${estado[k][1]}</div>`}</div>`)}
      <div class="row"><button class="btn" onClick=${todas}>Sincronizar todo</button><span class="muted" style=${{ fontSize: 12.5 }}>Las URLs se guardan solo en este navegador.</span></div>
    </div>`}
    ${tab === "manual" && html`<div class="stack">
      <div class="row">${Object.keys(NOMBRES).map((k) => html`<button key=${k} class=${"btn sm " + (tipo === k ? "" : "sec")} onClick=${() => elegir(k)}>${NOMBRES[k]} · ${db[k].length}</button>`)}</div>
      <p class="muted" style=${{ fontSize: 12.5 }}>Edita las filas aquí mismo o pega celdas copiadas de tu hoja (con encabezados). Columnas: ${COLS_TXT[tipo]}.</p>
      <textarea rows="10" value=${texto} onChange=${(e) => setTexto(e.target.value)} spellCheck=${false}></textarea>
      <div class="row"><button class="btn" onClick=${aplicar}>Guardar ${NOMBRES[tipo].toLowerCase()}</button><button class="btn sec" onClick=${() => setTexto(aCSV(tipo, db[tipo]))}>Deshacer cambios</button></div>
      <h3 style=${{ marginTop: 4 }}>Agregar un gasto rápido</h3>
      <div class="fgrid" style=${{ gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))" }}>
        <input type="date" value=${nuevo.fecha} onChange=${(e) => setNuevo({ ...nuevo, fecha: e.target.value })} />
        <input type="text" placeholder="Categoría" value=${nuevo.categoria} onChange=${(e) => setNuevo({ ...nuevo, categoria: e.target.value })} />
        <${Num} placeholder="Monto" value=${nuevo.monto} onChange=${(v) => setNuevo({ ...nuevo, monto: v })} />
        <select value=${nuevo.tarjeta} onChange=${(e) => setNuevo({ ...nuevo, tarjeta: e.target.value })}><option value="">Sin tarjeta</option>${db.tarjetas.map((t) => html`<option key=${t.id}>${t.nombre}</option>`)}</select>
        <button class="btn" onClick=${agregar}>Agregar</button></div>
    </div>`}
    ${tab === "json" && html`<div class="stack">
      <p class="muted" style=${{ fontSize: 13 }}>Pega un bloque con cualquiera de estas claves; solo se reemplaza lo que incluyas: <b>gastos</b>, <b>salud</b>, <b>rutina</b>, <b>cuentas</b>, <b>cajitas</b>, <b>tarjetas</b>, <b>metas</b>.</p>
      <textarea rows="9" value=${json} onChange=${(e) => setJson(e.target.value)} spellCheck=${false} placeholder='{"gastos":[{"fecha":"2026-11-16","categoria":"Comida","monto":18.5}],"cuentas":[{"nombre":"Ahorros","saldo":1200}]}'></textarea>
      <div class="row"><button class="btn" onClick=${importar}>Aplicar JSON</button><button class="btn sec" onClick=${() => setJson(JSON.stringify({ ...db, fuentes: undefined, demo: undefined, tema: undefined }, null, 1))}>Ver mis datos actuales</button>
        <button class="btn sec" onClick=${() => { if (confirm("¿Volver a los datos de prueba? Se reemplaza todo.")) { setDB({ ...ejemplo(), tema: db.tema }); toast("Datos de prueba cargados"); } }}>Datos de prueba</button></div>
    </div>`}
    ${tab === "metas" && html`<div class="fgrid">
      <label class="f">Ingreso mensual (si tu hoja no trae ingresos)<${Num} value=${M.ingresoMensual} onChange=${(v) => setMeta("ingresoMensual", v)} /></label>
      <label class="f">Presupuesto mensual de gastos<${Num} value=${M.presupuestoMensual} onChange=${(v) => setMeta("presupuestoMensual", v)} /></label>
      <label class="f">Meta de calorías diarias<${Num} value=${M.calorias} onChange=${(v) => setMeta("calorias", v)} /></label>
      <label class="f">Margen aceptado de calorías (%)<${Num} value=${M.tolerancia} onChange=${(v) => setMeta("tolerancia", v)} /></label>
      <label class="f">Meta de días de gym por semana<${Num} value=${M.gymSemanal} min="1" max="7" onChange=${(v) => setMeta("gymSemanal", clamp(+v || 1, 1, 7))} /></label>
      <label class="f">Símbolo de moneda<input type="text" maxLength="4" value=${db.moneda} onChange=${(e) => setDB((d) => ({ ...d, moneda: e.target.value }))} /></label>
      <label class="f full">Categorías que cuentan como comida y snacks (separadas por coma)<input type="text" value=${M.comida} onChange=${(e) => setMeta("comida", e.target.value)} /></label>
      <p class="muted full" style=${{ fontSize: 12.5 }}>Los ingresos se detectan en tu hoja de gastos cuando la categoría contiene «ingreso», «sueldo», «salario» o «abono».</p>
    </div>`}
  </div></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
